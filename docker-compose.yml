services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: cambrify
      POSTGRES_USER: cambrify
      POSTGRES_PASSWORD: cambrify-local
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cambrify"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    command: sh -c "python manage.py migrate && gunicorn cambrify.wsgi:application --bind 0.0.0.0:8000 --reload"
    environment:
      DJANGO_SECRET_KEY: local-docker-secret-change-before-production
      DJANGO_DEBUG: "True"
      DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1"
      DATABASE_URL: postgresql://cambrify:cambrify-local@db:5432/cambrify
      APP_URL: http://localhost:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
