[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "cambrifyiq"
version = "0.1.0"
description = "Multi-tenant academic planning for Cambridge schools"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "Django>=5.2,<5.3",
  "djangorestframework>=3.16,<3.17",
  "django-environ>=0.12,<0.13",
  "psycopg[binary]>=3.2,<3.3",
  "whitenoise>=6.9,<7",
  "gunicorn>=23,<24",
]

[project.optional-dependencies]
dev = [
  "coverage[toml]>=7.8,<8",
  "ruff>=0.11,<0.15",
]

[tool.setuptools.packages.find]
include = ["cambrify*", "apps*"]

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "DJ", "UP"]
ignore = ["DJ001", "DJ012"]

[tool.coverage.run]
source = ["apps"]
omit = ["*/migrations/*", "*/tests/*", "*/admin.py", "*/management/commands/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 80
